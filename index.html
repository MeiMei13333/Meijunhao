<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>IT 单词打卡</title>
<style>
:root{
  --ink:#1a2233; --sub:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
  --pri:#2563eb; --pri-d:#1e3a8a; --pri-soft:#eff6ff;
  --ok:#16a34a; --ok-soft:#f0fdf4; --bad:#dc2626; --bad-soft:#fef2f2; --warn:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
/* 主题：默认蓝 / 暗黑 / 护眼绿 / 活力橙 */
:root[data-theme=dark]{--ink:#e2e8f0;--sub:#94a3b8;--line:#334155;--bg:#0f172a;--card:#1e293b;--pri:#3b82f6;--pri-d:#111827;--pri-soft:#1e3a5f}
:root[data-theme=green]{--ink:#1f2d1f;--sub:#5f7060;--line:#d5e3d5;--bg:#eef5ee;--card:#f8fbf8;--pri:#2e7d32;--pri-d:#1b5e20;--pri-soft:#e0efe0}
:root[data-theme=orange]{--ink:#331a06;--sub:#8a6a50;--line:#f0dcc8;--bg:#fff5ec;--card:#fffdf9;--pri:#ea580c;--pri-d:#9a3412;--pri-soft:#ffeede}
#app{min-height:100vh;display:flex;flex-direction:column}

/* 顶栏（全宽栏 + 内部容器居中，修复缩放错位） */
header{background:var(--pri-d);color:#fff;padding:10px 0 calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:30;width:100%}
.hdwrap{max-width:540px;margin:0 auto;padding:0 14px}
.hd1{display:flex;align-items:center;justify-content:space-between}
.hd1 .title{font-size:17px;font-weight:700}
.hd1 .date{font-size:12px;opacity:.75}
.iconbtn{background:none;border:none;color:#fff;font-size:19px;cursor:pointer;padding:4px 8px}
.hd2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.pill{background:rgba(255,255,255,.16);border-radius:20px;padding:3px 10px;display:flex;align-items:center;gap:5px}
.pill.done{background:#22c55e}
.bar{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#60a5fa;border-radius:3px;transition:width .5s}
.bar i.full{background:#4ade80}

/* 页面 */
main{flex:1;width:100%;max-width:540px;margin:0 auto;padding:14px 14px 76px}
.page{display:none}
.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--sub);font-size:13px}
.btn{display:inline-block;background:var(--pri);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

/* 测验卡片 */
.qcard{text-align:center}
.qword{font-size:30px;font-weight:800;letter-spacing:.5px}
.qphon{color:var(--sub);font-size:14px;margin:2px 0 4px}
.speak{border:none;background:var(--pri-soft);color:var(--pri);border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;vertical-align:middle;margin-left:8px}
.qroot{font-size:13px;color:var(--warn);margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;text-align:left}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:14px;cursor:pointer;line-height:1.4;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;border-radius:10px;padding:12px;text-align:left;font-size:14px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb .ex{margin-top:6px;background:var(--pri-soft);border-radius:8px;padding:8px 10px;font-size:13px}
.fb .ex em{display:block;color:var(--sub);font-style:normal;margin-top:2px}
.qfoot{margin-top:14px}
.count{font-size:13px;color:var(--sub);margin-bottom:6px;text-align:right}

/* 单词本 */
.search{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:4px 13px;font-size:13px;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.wlist{max-height:none}
.wrow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border-bottom:none}
.wrow .w{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .m{flex:2;color:var(--sub);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{flex:none;font-size:11px;border-radius:8px;padding:1px 8px}
.st.new{background:#f1f5f9;color:var(--sub)}
.st.review{background:#fef3c7;color:#b45309}
.st.mastered{background:var(--ok-soft);color:var(--ok)}
.st.custom{background:var(--pri-soft);color:var(--pri)}
.del{border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 6px}
textarea.csv{width:100%;height:90px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:Consolas,monospace;resize:vertical}

/* 统计 */
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#f8fafc;color:var(--sub);cursor:default}
.cell.done{background:var(--ok);color:#fff}
.cell.mk{background:var(--ok-soft);color:var(--ok);border:1.5px dashed var(--ok)}
.cell.miss{background:#fee2e2;color:#b91c1c}
.cell.today{outline:2px solid var(--pri);outline-offset:-2px}
.cell.future{opacity:.35}
.calhead{display:flex;justify-content:space-between;align-items:center}

/* 底部导航（全宽栏 + 内部容器居中） */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navwrap{max-width:540px;margin:0 auto;display:flex}
.tab{flex:1;border:none;background:none;padding:9px 0 8px;font-size:12px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab i{font-style:normal;font-size:19px;line-height:1}
.tab.on{color:var(--pri);font-weight:600}
.tab .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tab{position:relative}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
@media (min-width:541px){.mask{align-items:center}}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:82vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:541px){.sheet{border-radius:16px;max-height:70vh}}
.sheet h3{margin-bottom:12px;font-size:17px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv b{flex:none;color:var(--sub);font-weight:500;width:70px;font-size:13px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--sub);padding:36px 0;font-size:14px}
/* 不认识按钮 */
.dk{margin-top:10px;width:100%;border:1.5px dashed var(--sub);background:none;color:var(--sub);border-radius:10px;padding:9px;font-size:14px;cursor:pointer}
.dk:disabled{opacity:.5}
/* 积分商店 */
.shoprow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.shoprow:last-child{border-bottom:none}
.swatch{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line)}
.shoprow .nm{flex:1;font-size:14px;font-weight:600}
.shoprow .nm small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.logline{font-size:13px;color:var(--sub);padding:3px 0}
.banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* V3：题型 / 易错本 / 分类进度 */
.qhint{font-size:14px;color:var(--sub);margin-bottom:8px}
.qsent{font-size:17px;font-weight:600;line-height:1.8;margin:6px 0 4px}
.qreveal{margin-top:6px;font-size:14px}
.qreveal b{font-size:18px;margin-right:6px}
.st.hard{background:#fef3c7;color:#b45309}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--ink);cursor:pointer}
.catrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.catrow:last-child{border-bottom:none}
.catrow .cn{flex:none;width:60px;color:var(--sub)}
.catbar{flex:1;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.catbar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.catrow .cnum{flex:none;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hdwrap">
      <div class="hd1">
        <div><span class="title">IT 单词打卡</span> <span class="date" id="hdDate"></span></div>
        <button class="iconbtn" id="btnSet" title="设置">⚙</button>
      </div>
      <div class="hd2">
        <span class="pill" id="hdTime">⏱ 00:00 / 10:00</span>
        <div class="bar"><i id="hdBar"></i></div>
        <span class="pill" id="hdPts">🪐 0</span>
        <span class="pill" id="hdBadge">未打卡</span>
      </div>
    </div>
  </header>

  <main>
    <section class="page on" id="page-study"></section>
    <section class="page" id="page-review"></section>
    <section class="page" id="page-book"></section>
    <section class="page" id="page-stats"></section>
  </main>

  <nav><div class="navwrap">
    <button class="tab on" data-tab="study"><i>📖</i>学习</button>
    <button class="tab" data-tab="review"><i>🔁</i>复习<span class="dot" id="revDot" style="display:none"></span></button>
    <button class="tab" data-tab="book"><i>📒</i>单词本</button>
    <button class="tab" data-tab="stats"><i>📊</i>统计</button>
  </div></nav>
</div>

<div class="mask" id="maskDetail"><div class="sheet" id="detailBody"></div></div>
<div class="mask" id="maskSet"><div class="sheet">
  <h3>设置</h3>
  <div class="field"><label>每日新词量（5–100）</label><input type="number" id="setN" min="5" max="100"></div>
  <div class="field"><label>测验题型（每词随机出现）</label>
    <div class="row" id="typeBox">
      <label class="ck"><input type="checkbox" value="choice">看词选义</label>
      <label class="ck"><input type="checkbox" value="listen">听音选词</label>
      <label class="ck"><input type="checkbox" value="cloze">例句挖空</label>
    </div>
  </div>
  <div class="field"><label>每日提醒时间</label><input type="time" id="setTime"></div>
  <div class="field"><label>浏览器提醒（仅页面打开时生效）</label>
    <div class="row"><button class="btn sm ghost" id="setRemindOn">开启</button><button class="btn sm ghost" id="setRemindOff">关闭</button><span class="muted" id="remindState"></span></div>
  </div>
  <div class="field"><label>手机闹钟提醒文案（自行粘贴到闹钟/日程）</label>
    <button class="btn sm ghost" id="copyRemind">📋 复制提醒文案</button>
  </div>
  <div class="row spread"><button class="btn danger sm" id="btnReset">清空全部数据</button><button class="btn sm" id="setClose">完成</button></div>
</div></div>
<div id="toast"></div>

<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script src="app.js"></script>
</body>
</html>
